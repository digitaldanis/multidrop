name: Android

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - name: Protocol and codec tests
        run: android/test.sh
      - name: Desktop / Android interoperability
        run: python android/tests/test_desktop_interop.py
      - name: Build signed preview APK
        run: android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MultiDrop-Android-preview
          path: android/build/MultiDrop-Android-0.2.0.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Android-protocol-fixtures
          path: |
            android/build/test-frame.caf
            android/build/expected.pcm
            android/build/decoded.pcm
  emulator-smoke:
    needs: build-and-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MultiDrop-Android-preview
          path: android/build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python3 android/tests/emulator_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-smoke
          path: android/build/smoke/
