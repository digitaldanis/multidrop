  ["هل يوجد AirDrop لنظام Windows؟", "لا تعمل تقنية AirDrop اللاسلكية من Apple ‏(AWDL) مع تعريفات Wi-Fi في Windows. يتكفّل MultiDrop بالباقي: يرسل iPhone عبر تطبيق LocalSend المجاني، وأندرويد وسامسونج عبر Quick Share، إضافة إلى عرض الشاشة عبر AirPlay."],
  ["هل يوجد AirDrop لنظام Linux؟", "نعم. يرسل MultiDrop ويستقبل عبر AirDrop مع iPhone وiPad وMac على Linux إذا كانت بطاقة Wi-Fi تدعم ذلك (مثل MediaTek MT7925)."],
  ["كيف أنقل الملفات من iPhone إلى الكمبيوتر دون كابل؟", "شغّل MultiDrop على الكمبيوتر، ثم أرسل من تطبيق LocalSend المجاني على iPhone."],
  ["هل يمكنني استخدام Quick Share على الكمبيوتر؟", "نعم. يظهر MultiDrop في قائمة Quick Share على هواتف أندرويد وسامسونج في Windows وLinux دون حساب Google."],
  ["هل MultiDrop مجاني ويحافظ على الخصوصية؟", "نعم. مفتوح المصدر (GPL-3.0)، بلا خادم ولا حساب، والملفات تنتقل مباشرة بين أجهزتك."],
]
footer = "‏AirDrop وAirPlay علامتان تجاريتان لشركة Apple Inc.، وQuick Share لشركتي Google LLC وSamsung Electronics. ‏MultiDrop مشروع مستقل مفتوح المصدر."
languages = "اللغات"

