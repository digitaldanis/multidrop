# Texts of the website (https://digitaldanis.github.io/multidrop/) and of the
# "MultiDrop in your language" list in README.md. tools/build_site.py turns
# them into one page per language; run it with --readme to refresh README.md.
#
# Keep every language truthful to README.md: real AirDrop works on Linux with a
# supported Wi-Fi card; on Windows iPhones send via LocalSend.

[en]
name = "English"
flag = "🇬🇧"
title = "MultiDrop – AirDrop, Quick Share and AirPlay for Windows and Linux"
description = "Free, open-source app with AirDrop, Quick Share, LocalSend and AirPlay for Windows and Linux. Send files between your PC and iPhone, Android or Samsung – no cable, no cloud, no account."
h1 = "AirDrop, Quick Share, LocalSend and AirPlay in one app – for Windows and Linux"
lead = "Your PC shows up in the share menu of every phone in the room. iPhones speak AirDrop, Android and Samsung phones speak Quick Share, the rest use LocalSend – MultiDrop speaks all of them at once."
summary = "AirDrop, Quick Share, LocalSend and AirPlay in one app for Windows and Linux: send files between your PC and an iPhone, Android or Samsung phone – no cable, no cloud, no account."
more = "More"
download = "Download for Windows"
linux = "Install on Linux"
source = "Source code on GitHub"
features_title = "What MultiDrop does"
features = [
  "**Quick Share / Nearby Share** on Windows and Linux – Android and Samsung phones send to your PC from their share menu, no app needed",
  "**AirDrop on Linux** – send and receive with iPhone, iPad and Mac (supported Wi-Fi card)",
  "**iPhone to Windows** – with the free LocalSend app",
  "**AirPlay** – mirror your Windows or Linux screen to an Apple TV, play your PC's sound on HomePod and Sonos",
  "**Private** – directly between devices on your Wi-Fi, encrypted, no server, no account",
]
apt_title = "Ubuntu and Debian"
faq_title = "Questions"
faq = [
  ["Is there AirDrop for Windows?", "Apple's AirDrop radio (AWDL) does not run on Windows Wi-Fi drivers. MultiDrop covers the rest on Windows: iPhones send with the free LocalSend app, Android and Samsung use Quick Share, and you get AirPlay screen mirroring."],
  ["Is there AirDrop for Linux?", "Yes. MultiDrop sends to and receives from iPhones, iPads and Macs with AirDrop on Linux when the Wi-Fi card supports it (for example MediaTek MT7925)."],
  ["How do I send files from an iPhone to a PC without a cable?", "Start MultiDrop on the PC, then send from the free LocalSend app on the iPhone."],
  ["Can I use Quick Share on a PC?", "Yes. MultiDrop appears in the Quick Share menu of Android and Samsung phones on Windows and Linux, without a Google account."],
  ["Is MultiDrop free and private?", "Yes. It is open source (GPL-3.0), has no server and no account, and files go directly between your devices."],
]
footer = "AirDrop and AirPlay are trademarks of Apple Inc., Quick Share of Google LLC and Samsung Electronics. MultiDrop is an independent open-source project."
languages = "Languages"

